name: Binance GPT - STC04 momentum diario BTC ETH

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        symbol: [BTCUSDT, ETHUSDT]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Ejecutar pruebas unitarias
        run: python -m unittest discover -s stc04 -p 'test_stc04.py' -v
      - name: Descargar velas diarias reales
        run: |
          python stc04/fetch_daily_stc04.py \
            --symbol '${{ matrix.symbol }}' \
            --start 2024-01-01T00:00:00Z \
            --end 2026-10-01T00:00:00Z \
            --outdir stc04/history
      - name: Backtest ventana 2024-2025
        working-directory: stc04
        run: |
          python backtest_stc04.py \
            --csv history/${{ matrix.symbol }}_spot_1d.csv \
            --evaluation-start 2024-10-01T00:00:00Z \
            --evaluation-end 2025-10-01T00:00:00Z \
            --fee-bps 10 --slippage-bps 5 \
            --output history/${{ matrix.symbol }}-2024-2025.json
      - name: Backtest ventana 2025-2026
        working-directory: stc04
        run: |
          python backtest_stc04.py \
            --csv history/${{ matrix.symbol }}_spot_1d.csv \
            --evaluation-start 2025-10-01T00:00:00Z \
            --evaluation-end 2026-10-01T00:00:00Z \
            --fee-bps 10 --slippage-bps 5 \
            --output history/${{ matrix.symbol }}-2025-2026.json
      - name: Auditar independientemente ventana 2024-2025
        working-directory: stc04
        run: |
          python audit_stc04.py \
            --csv history/${{ matrix.symbol }}_spot_1d.csv \
            --manifest history/${{ matrix.symbol }}-manifest.json \
            --result history/${{ matrix.symbol }}-2024-2025.json \
            --output history/${{ matrix.symbol }}-2024-2025-audit.json
      - name: Auditar independientemente ventana 2025-2026
        working-directory: stc04
        run: |
          python audit_stc04.py \
            --csv history/${{ matrix.symbol }}_spot_1d.csv \
            --manifest history/${{ matrix.symbol }}-manifest.json \
            --result history/${{ matrix.symbol }}-2025-2026.json \
            --output history/${{ matrix.symbol }}-2025-2026-audit.json
      - name: Guardar artefactos STC04
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stc04-${{ matrix.symbol }}-research
          path: stc04/history/
          if-no-files-found: warn
          retention-days: 14
