
name: Binance GPT - auditoria

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write

concurrency:
  group: binance-gpt-independent-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Congelar instantanea de mercado
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;

            const ref = await github.rest.git.getRef({
              owner,
              repo,
              ref: 'heads/data'
            });

            const commit = ref.data.object.sha;

            const response = await github.rest.repos.getContent({
              owner,
              repo,
              path: 'latest.json',
              ref: commit
            });

            if (
              Array.isArray(response.data) ||
              response.data.encoding !== 'base64' ||
              !response.data.content
            ) {
              throw new Error('No se pudo leer latest.json');
            }

            const bytes = Buffer.from(
              response.data.content.replace(/\s/g, ''),
              'base64'
            );

            const data = JSON.parse(bytes.toString('utf8'));

            if (
              data.schema !== 'binance-gpt-market-data-v1' ||
              !data.generated_at_utc ||
              !Array.isArray(data.results) ||
              !Array.isArray(data.bitget_futures_results)
            ) {
              throw new Error('Esquema de mercado invalido');
            }

            fs.writeFileSync('audit-input.json', bytes);
            fs.writeFileSync('audit-source-commit.txt', commit);

            core.info(
              'Instantanea: ' + data.generated_at_utc
            );
            core.info(
              'Commit de origen: ' + commit
            );

      - name: Auditar datos de Binance
        shell: bash
        run: |
          python audit_market_data.py \
            --json-url "file://${GITHUB_WORKSPACE}/audit-input.json" \
            --max-json-age 300 \
            --output audit-result.json

      - name: Publicar instantanea y certificado
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const crypto = require('crypto');
            const { owner, repo } = context.repo;

            const snapshotBytes =
              fs.readFileSync('audit-input.json');

            const reportBytes =
              fs.readFileSync('audit-result.json');

            const snapshot =
              JSON.parse(snapshotBytes.toString('utf8'));

            const report =
              JSON.parse(reportBytes.toString('utf8'));

            const sha256 = bytes =>
              crypto.createHash('sha256')
                .update(bytes)
                .digest('hex');

            const snapshotHash = sha256(snapshotBytes);
            const reportHash = sha256(reportBytes);

            const timestampsMatch =
              Number.isFinite(
                Date.parse(snapshot.generated_at_utc)
              ) &&
              Date.parse(snapshot.generated_at_utc) ===
              Date.parse(report.json_generated_at_utc);

            const spotPass =
              report.spot_series_audited === 6 &&
              report.spot_mathematical_status === 'PASS' &&
              report.spot_integrity_status === 'PASS';

            const bitgetPass =
              report.bitget_futures_series_audited === 6 &&
              report.bitget_futures_mathematical_status === 'PASS' &&
              report.bitget_futures_integrity_status === 'PASS';

            const passed =
              report.audit_version === '4.0' &&
              report.mathematical_status === 'PASS' &&
              report.integrity_status === 'PASS' &&
              report.freshness_status === 'CURRENT' &&
              report.operational_status === 'DATA_CHECKS_OK' &&
              timestampsMatch &&
              spotPass &&
              bitgetPass;

            if (!passed) {
              throw new Error(
                'Auditoria no aprobada: no se publica'
              );
            }

            const originCommit = fs
              .readFileSync('audit-source-commit.txt', 'utf8')
              .trim();

            const certificate = {
              schema: 'binance-gpt-audit-certificate-v1',
              certificate_status: 'PASS',
              independent_audit: true,
              audit_version: '4.0',
              audited_at_utc: report.audited_at_utc,
              json_generated_at_utc:
                snapshot.generated_at_utc,
              snapshot_sha256: snapshotHash,
              audit_report_sha256: reportHash,
              audited_snapshot_path: 'audited-latest.json',
              source_branch_commit: originCommit,
              spot_series_audited: 6,
              spot_mathematical_status: 'PASS',
              spot_integrity_status: 'PASS',
              bitget_futures_series_audited: 6,
              bitget_futures_mathematical_status: 'PASS',
              bitget_futures_integrity_status: 'PASS',
              binance_futures_audited: false,
              binance_futures_errors_declared:
                report.binance_futures_errors_declared,
              freshness_at_audit: 'CURRENT',
              note:
                'Certifica exclusivamente audited-latest.json ' +
                'cuando su SHA-256 coincida. No certifica ' +
                'latest.json ni actualizaciones posteriores.'
            };

            const certificateText =
              JSON.stringify(certificate, null, 2) + '\n';

            fs.writeFileSync(
              'audit-latest.json',
              certificateText
            );

            const branch = 'data';

            const ref = await github.rest.git.getRef({
              owner,
              repo,
              ref: `heads/${branch}`
            });

            const parentSha = ref.data.object.sha;

            const parent = await github.rest.git.getCommit({
              owner,
              repo,
              commit_sha: parentSha
            });

            // Ambos archivos se agregan al mismo arbol.
            // latest.json permanece intacto.
            const tree = await github.rest.git.createTree({
              owner,
              repo,
              base_tree: parent.data.tree.sha,
              tree: [
                {
                  path: 'audited-latest.json',
                  mode: '100644',
                  type: 'blob',
                  content: snapshotBytes.toString('utf8')
                },
                {
                  path: 'audit-latest.json',
                  mode: '100644',
                  type: 'blob',
                  content: certificateText
                }
              ]
            });

            const commit = await github.rest.git.createCommit({
              owner,
              repo,
              message:
                'Publish audited snapshot and matching certificate',
              tree: tree.data.sha,
              parents: [parentSha]
            });

            await github.rest.git.updateRef({
              owner,
              repo,
              ref: `heads/${branch}`,
              sha: commit.data.sha,
              force: false
            });

            core.info('PUBLICACION AUDITADA: OK');
            core.info('Commit: ' + commit.data.sha);
            core.info('SHA256: ' + snapshotHash);
            core.info(
              'Instantanea auditada: ' +
              snapshot.generated_at_utc
            );

      - name: Guardar resultado
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: binance-gpt-audit-result
          path: |
            audit-input.json
            audit-result.json
            audited-latest.json
            audit-latest.json
          if-no-files-found: warn
          retention-days: 7
