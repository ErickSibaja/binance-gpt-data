
name: Binance GPT - auditoria

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Auditar datos de Binance
        run: python audit_market_data.py

      - name: Guardar resultado
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: binance-audit-result
          path: audit-result.json
          if-no-files-found: warn
