
name: Binance GPT - auditoria

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write

concurrency:
  group: binance-gpt-independent-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Congelar instantanea del JSON
        shell: bash
        run: |
          python - <<'PYCODE'
          import hashlib
          import json
          import time
          import urllib.request
          from pathlib import Path

          base = (
              "https://raw.githubusercontent.com/"
              "ErickSibaja/binance-gpt-data/"
              "data/latest.json"
          )

          url = base + "?cb=" + str(time.time_ns())

          req = urllib.request.Request(
              url,
              headers={
                  "User-Agent": "BinanceGPTAudit/5.0",
                  "Accept": "application/json",
              },
          )

          with urllib.request.urlopen(
              req, timeout=30
          ) as response:
              raw = response.read()

          data = json.loads(raw)

          if data.get("schema") != (
              "binance-gpt-market-data-v1"
          ):
              raise ValueError(
                  "Esquema del JSON inesperado"
              )

          if not data.get("generated_at_utc"):
              raise ValueError(
                  "JSON sin fecha de generacion"
              )

          if not isinstance(
              data.get("bitget_futures_results"), list
          ):
              raise ValueError(
                  "JSON sin bloque Bitget"
              )

          Path("audit-input.json").write_bytes(raw)

          digest = hashlib.sha256(raw).hexdigest()

          print(
              "Instantanea congelada:",
              data["generated_at_utc"]
          )

          print("SHA-256:", digest)
          print("Bytes:", len(raw))
          PYCODE

      - name: Auditar datos de Binance
        shell: bash
        run: |
          python audit_market_data.py \
            --json-url "file://${GITHUB_WORKSPACE}/audit-input.json" \
            --max-json-age 300 \
            --output audit-result.json

      - name: Publicar certificado en rama data
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const crypto = require('crypto');

            const snapshot = fs.readFileSync(
              'audit-input.json'
            );

            const reportBytes = fs.readFileSync(
              'audit-result.json'
            );

            const data = JSON.parse(
              snapshot.toString('utf8')
            );

            const report = JSON.parse(
              reportBytes.toString('utf8')
            );

            const snapshotHash = crypto
              .createHash('sha256')
              .update(snapshot)
              .digest('hex');

            const reportHash = crypto
              .createHash('sha256')
              .update(reportBytes)
              .digest('hex');

            const spotOK =
              report.spot_series_audited === 6 &&
              report.spot_mathematical_status === 'PASS' &&
              report.spot_integrity_status === 'PASS';

            const bitgetOK =
              report.bitget_futures_series_audited === 6 &&
              report.bitget_futures_mathematical_status === 'PASS' &&
              report.bitget_futures_integrity_status === 'PASS';

            const generatedMatches =
              Date.parse(report.json_generated_at_utc) ===
              Date.parse(data.generated_at_utc);

            const valid =
              spotOK &&
              bitgetOK &&
              generatedMatches &&
              report.freshness_status === 'CURRENT' &&
              report.mathematical_status === 'PASS' &&
              report.integrity_status === 'PASS';

            if (!valid) {
              core.setFailed(
                'Auditoria no apta para certificar'
              );
              return;
            }

            const { owner, repo } = context.repo;
            const branch = 'data';

            const refResponse = await github.rest.git.getRef({
              owner,
              repo,
              ref: `heads/${branch}`
            });

            const currentCommit = refResponse.data.object.sha;

            const fileResponse = await github.rest.repos.getContent({
              owner,
              repo,
              path: 'latest.json',
              ref: currentCommit
            });

            if (
              Array.isArray(fileResponse.data) ||
              !fileResponse.data.content
            ) {
              core.setFailed(
                'No se pudo verificar latest.json'
              );
              return;
            }

            const publishedBytes = Buffer.from(
              fileResponse.data.content.replace(/\n/g, ''),
              'base64'
            );

            const publishedHash = crypto
              .createHash('sha256')
              .update(publishedBytes)
              .digest('hex');

            if (publishedHash !== snapshotHash) {
              core.warning(
                'El recolector publico otra instantanea. ' +
                'No se reemplaza el certificado anterior.'
              );
              return;
            }

            const certificate = {
              schema: 'binance-gpt-audit-certificate-v1',
              certificate_status: 'PASS',
              independent_audit: true,
              audit_version: report.audit_version,
              audited_at_utc: report.audited_at_utc,
              json_generated_at_utc: data.generated_at_utc,
              snapshot_sha256: snapshotHash,
              audit_report_sha256: reportHash,
              snapshot_source:
                'https://raw.githubusercontent.com/' +
                'ErickSibaja/binance-gpt-data/' +
                'data/latest.json',
              spot_series_audited:
                report.spot_series_audited,
              spot_mathematical_status:
                report.spot_mathematical_status,
              spot_integrity_status:
                report.spot_integrity_status,
              bitget_futures_series_audited:
                report.bitget_futures_series_audited,
              bitget_futures_mathematical_status:
                report.bitget_futures_mathematical_status,
              bitget_futures_integrity_status:
                report.bitget_futures_integrity_status,
              binance_futures_audited: false,
              binance_futures_errors_declared:
                report.binance_futures_errors_declared,
              freshness_at_audit:
                report.freshness_status,
              note:
                'Certifica solamente la instantanea ' +
                'identificada por snapshot_sha256. ' +
                'No certifica futuras actualizaciones.'
            };

            const content = JSON.stringify(
              certificate, null, 2
            ) + '\n';

            fs.writeFileSync(
              'audit-latest.json',
              content,
              'utf8'
            );

            const commitResponse = await github.rest.git.getCommit({
              owner,
              repo,
              commit_sha: currentCommit
            });

            const treeResponse = await github.rest.git.createTree({
              owner,
              repo,
              base_tree: commitResponse.data.tree.sha,
              tree: [{
                path: 'audit-latest.json',
                mode: '100644',
                type: 'blob',
                content
              }]
            });

            const newCommit = await github.rest.git.createCommit({
              owner,
              repo,
              message: 'Publish audited snapshot certificate',
              tree: treeResponse.data.sha,
              parents: [currentCommit]
            });

            await github.rest.git.updateRef({
              owner,
              repo,
              ref: `heads/${branch}`,
              sha: newCommit.data.sha,
              force: false
            });

            core.info(
              'Certificado publicado. SHA-256: ' +
              snapshotHash
            );

      - name: Guardar resultado
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: binance-gpt-audit-result
          path: |
            audit-input.json
            audit-result.json
            audit-latest.json
          if-no-files-found: warn
          retention-days: 7
