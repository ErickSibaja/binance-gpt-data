
name: Binance GPT - datos diarios

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  collect-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Pruebas internas de cálculos
        run: python -m unittest discover -s tests -v

      - name: Consultar mercado público de Binance
        run: python collector.py

      - name: Revisar estado de datos
        run: |
          python - <<'PYCODE'
          import json
          with open('public/latest.json', encoding='utf-8') as f:
              data = json.load(f)
          print('Estado:', data['status'])
          print('Series verificadas:', data['verified_series'])
          print('Series con errores:', data['unavailable_series'])
          for entry in data['errors']:
              print(
                  'SIN DATOS:',
                  entry['market'],
                  entry['symbol'],
                  entry['interval'],
                  entry['error']
              )
          PYCODE

      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Publicar archivos de resultados
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Desplegar GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Publicar JSON en rama data
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const content = fs.readFileSync(
              'public/latest.json',
              'utf8'
            );
            const { owner, repo } = context.repo;
            const branch = 'data';

            let currentRef = null;

            try {
              const response = await github.rest.git.getRef({
                owner,
                repo,
                ref: `heads/${branch}`
              });
              currentRef = response.data;
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            let baseTree;
            let parents = [];

            if (currentRef) {
              const commit = await github.rest.git.getCommit({
                owner,
                repo,
                commit_sha: currentRef.object.sha
              });
              baseTree = commit.data.tree.sha;
              parents = [currentRef.object.sha];
            }

            const treeArgs = {
              owner,
              repo,
              tree: [{
                path: 'latest.json',
                mode: '100644',
                type: 'blob',
                content
              }]
            };

            if (baseTree) {
              treeArgs.base_tree = baseTree;
            }

            const tree = await github.rest.git.createTree(
              treeArgs
            );

            const commit = await github.rest.git.createCommit({
              owner,
              repo,
              message: 'Update Binance market data',
              tree: tree.data.sha,
              parents
            });

            if (currentRef) {
              await github.rest.git.updateRef({
                owner,
                repo,
                ref: `heads/${branch}`,
                sha: commit.data.sha,
                force: false
              });
            } else {
              await github.rest.git.createRef({
                owner,
                repo,
                ref: `refs/heads/${branch}`,
                sha: commit.data.sha
              });
            }

            core.info(
              `Publicado latest.json en ${branch}`
            );
