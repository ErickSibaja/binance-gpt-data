
name: Binance GPT - diagnostico Futuros

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostico:
    runs-on: ubuntu-latest

    steps:
      - name: Probar proveedores gratuitos
        shell: bash
        run: |
          python - <<'PYCODE'
          import json
          import urllib.request
          import urllib.error
          from datetime import datetime, timezone

          BASES = {
              "Bybit": (
                  "https://api.bybit.com/v5/market/kline",
                  {"category": "linear"},
                  {"15m": "15", "1h": "60", "4h": "240"}
              ),
              "Bitget": (
                  "https://api.bitget.com/api/v3/market/candles",
                  {"category": "USDT-FUTURES"},
                  {"15m": "15m", "1h": "1H", "4h": "4H"}
              )
          }

          from urllib.parse import urlencode

          print("Hora UTC:", datetime.now(timezone.utc).isoformat())

          for provider, (base, params, intervals) in BASES.items():
              for symbol in ("BTCUSDT", "ETHUSDT"):
                  for label, interval in intervals.items():
                      query = dict(params)
                      query.update({
                          "symbol": symbol,
                          "interval": interval,
                          "limit": "500"
                      })
                      url = base + "?" + urlencode(query)
                      print(
                          "\nPROVEEDOR:", provider,
                          "SIMBOLO:", symbol,
                          "INTERVALO:", label
                      )

                      try:
                          req = urllib.request.Request(
                              url,
                              headers={
                                  "User-Agent": "BinanceGPT-Diagnostic/1.0",
                                  "Accept": "application/json"
                              }
                          )
                          with urllib.request.urlopen(req, timeout=20) as r:
                              payload = json.load(r)
                              print("HTTP:", r.status)

                          if provider == "Bybit":
                              ok = payload.get("retCode") == 0
                              rows = payload.get("result", {}).get("list", [])
                          else:
                              ok = payload.get("code") == "00000"
                              rows = payload.get("data", [])

                          print("API OK:", ok)
                          print("VELAS RECIBIDAS:", len(rows))

                          if ok and rows:
                              timestamps = sorted(int(x[0]) for x in rows)
                              print("PRIMER TIMESTAMP:", timestamps[0])
                              print("ULTIMO TIMESTAMP:", timestamps[-1])

                              minutes = {
                                  "15m": 15,
                                  "1h": 60,
                                  "4h": 240
                              }[label]
                              duration = minutes * 60 * 1000
                              now_ms = int(
                                  datetime.now(timezone.utc).timestamp() * 1000
                              )

                              closed = [
                                  t for t in timestamps
                                  if t + duration <= now_ms
                              ]
                              contiguous = all(
                                  b - a == duration
                                  for a, b in zip(closed, closed[1:])
                              )

                              print("VELAS CERRADAS:", len(closed))
                              print("CONTINUIDAD:", contiguous)
                              print(
                                  "SUFICIENTES 499:",
                                  len(closed) >= 499
                              )

                      except urllib.error.HTTPError as e:
                          print("HTTP ERROR:", e.code)
                          print(
                              "DETALLE:",
                              e.read(200).decode(
                                  "utf-8", errors="replace"
                              )
                          )
                      except Exception as e:
                          print(
                              "ERROR:",
                              type(e).__name__,
                              str(e)[:200]
                          )

          print("\nDiagnostico finalizado.")
          PYCODE
