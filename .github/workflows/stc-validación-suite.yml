
name: Binance GPT - STC04 Validation Suite 7 etapas

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'full: 7 etapas con histórico; daily: reutilizar histórico y actualizar paper'
        required: true
        type: choice
        options:
          - full
          - daily
        default: full

  schedule:
    - cron: '35 1 * * *'

permissions:
  contents: write

concurrency:
  group: stc04-paper-state
  cancel-in-progress: false

jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout source main
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify frozen strategy unit tests
        run: |
          python -m unittest discover -s stc04 -p 'test_stc04.py' -v
          python -m unittest discover -s stc04 -p 'test_paper_suite.py' -v

      - name: Prepare separate persistent state branch
        shell: bash
        run: |
          set -euo pipefail

          if git ls-remote --exit-code --heads origin stc04-paper >/dev/null 2>&1; then
            git fetch origin stc04-paper:refs/remotes/origin/stc04-paper
            git worktree add --detach paper_state origin/stc04-paper
            git -C paper_state switch -c stc04-paper --track origin/stc04-paper
          else
            git worktree add --detach paper_state HEAD
            git -C paper_state switch --orphan stc04-paper
          fi

      - name: Execute seven stage suite
        shell: bash
        env:
          INPUT_MODE: ${{ github.event.inputs.mode }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail

          MODE=full

          if [ "$EVENT_NAME" = 'schedule' ]; then
            MODE=daily
          elif [ "$INPUT_MODE" = 'daily' ]; then
            MODE=daily
          fi

          python stc04/validation_suite.py \
            --mode "$MODE" \
            --state-dir paper_state \
            --output-dir suite_results

      - name: Persist state (only after successful validation)
        shell: bash
        run: |
          set -euo pipefail

          cd paper_state

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add ledger.jsonl paper-report.json baseline-certification.json

          if ! git diff --cached --quiet; then
            git commit -m "stc04 paper append and certification ${GITHUB_RUN_ID}"
            git push origin HEAD:refs/heads/stc04-paper
          else
            echo 'No new state to commit'
          fi

      - name: Upload complete report and historical validation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stc04-seven-stage-validation
          path: |
            suite_results/suite-report.json
            suite_results/baseline/*-202*.json
            paper_state/paper-report.json
            paper_state/baseline-certification.json
          if-no-files-found: warn
          retention-days: 30
