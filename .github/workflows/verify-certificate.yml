
name: Binance GPT - verificar certificado

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Verificar certificado SHA256
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const crypto = require('crypto');
            const { owner, repo } = context.repo;

            const ref = await github.rest.git.getRef({
              owner,
              repo,
              ref: 'heads/data'
            });

            const commit = ref.data.object.sha;

            async function read(path) {
              const response = await github.rest.repos.getContent({
                owner,
                repo,
                path,
                ref: commit
              });

              const item = response.data;

              if (
                Array.isArray(item) ||
                item.encoding !== 'base64' ||
                !item.content
              ) {
                throw new Error('Archivo invalido: ' + path);
              }

              return Buffer.from(
                item.content.replace(/\s/g, ''),
                'base64'
              );
            }

            const latestBytes = await read('latest.json');
            const auditedBytes = await read('audited-latest.json');
            const certificateBytes = await read('audit-latest.json');

            const latest = JSON.parse(latestBytes.toString('utf8'));
            const audited = JSON.parse(auditedBytes.toString('utf8'));
            const cert = JSON.parse(certificateBytes.toString('utf8'));

            const hash = bytes => crypto
              .createHash('sha256')
              .update(bytes)
              .digest('hex');

            const latestHash = hash(latestBytes);
            const auditedHash = hash(auditedBytes);

            const now = Date.now();
            const latestDate = Date.parse(latest.generated_at_utc);
            const auditedDate = Date.parse(audited.generated_at_utc);

            const latestAge = (now - latestDate) / 1000;
            const auditedAge = (now - auditedDate) / 1000;

            const latestCurrent =
              Number.isFinite(latestAge) &&
              latestAge >= 0 &&
              latestAge <= 300;

            const auditedCurrent =
              Number.isFinite(auditedAge) &&
              auditedAge >= 0 &&
              auditedAge <= 300;

            const schemasOK =
              latest.schema === 'binance-gpt-market-data-v1' &&
              audited.schema === 'binance-gpt-market-data-v1' &&
              cert.schema === 'binance-gpt-audit-certificate-v1';

            const historicalHashMatches =
              auditedHash === cert.snapshot_sha256;

            const historicalDateMatches =
              audited.generated_at_utc ===
              cert.json_generated_at_utc;

            const certificatePass =
              cert.certificate_status === 'PASS' &&
              cert.independent_audit === true &&
              cert.audit_version === '4.0' &&
              cert.audited_snapshot_path === 'audited-latest.json' &&
              cert.spot_series_audited === 6 &&
              cert.spot_mathematical_status === 'PASS' &&
              cert.spot_integrity_status === 'PASS' &&
              cert.bitget_futures_series_audited === 6 &&
              cert.bitget_futures_mathematical_status === 'PASS' &&
              cert.bitget_futures_integrity_status === 'PASS' &&
              cert.binance_futures_audited === false;

            const expectedKeys = [
              'BTCUSDT:15m', 'BTCUSDT:1h', 'BTCUSDT:4h',
              'ETHUSDT:15m', 'ETHUSDT:1h', 'ETHUSDT:4h'
            ].sort();

            function completeMarket(rows, market, exchange) {
              if (!Array.isArray(rows) || rows.length !== 6) {
                return false;
              }
              const keys = [];
              for (const r of rows) {
                if (
                  r.status !== 'verified' ||
                  r.market !== market ||
                  r.exchange !== exchange ||
                  r.closed_candles_used !== 499
                ) {
                  return false;
                }
                keys.push(r.symbol + ':' + r.interval);
              }
              return JSON.stringify(keys.sort()) ===
                JSON.stringify(expectedKeys);
            }

            const historicalCoverage =
              completeMarket(audited.results, 'spot', 'binance') &&
              completeMarket(
                audited.bitget_futures_results,
                'bitget_usdt_futures',
                'bitget'
              );

            const historicalValid =
              schemasOK &&
              historicalHashMatches &&
              historicalDateMatches &&
              certificatePass &&
              historicalCoverage &&
              Number.isFinite(Date.parse(cert.audited_at_utc));

            const currentMatches =
              latestHash === auditedHash;

            const certifiedCurrent =
              historicalValid &&
              currentMatches &&
              latestCurrent &&
              auditedCurrent;

            let status;

            if (!historicalValid) {
              status = 'INVALID_CERTIFICATE';
            } else if (certifiedCurrent) {
              status = 'CERTIFIED_CURRENT';
            } else if (latestCurrent) {
              status = 'CURRENT_NOT_CERTIFIED';
            } else {
              status = 'HISTORICAL_AUDIT_PASS';
            }

            const result = {
              schema: 'binance-gpt-verification-v2',
              verification_status: status,
              historical_audit_status:
                historicalValid ? 'PASS' : 'FAIL',
              current_snapshot_certified: certifiedCurrent,
              latest_freshness:
                latestCurrent ? 'CURRENT' : (
                  Number.isFinite(latestAge) &&
                  latestAge >= 0 && latestAge <= 600
                    ? 'DELAYED'
                    : 'STALE_OR_INVALID'
                ),
              verified_at_utc: new Date(now).toISOString(),
              branch_commit: commit,
              latest_generated_at_utc:
                latest.generated_at_utc,
              audited_generated_at_utc:
                audited.generated_at_utc,
              latest_age_seconds:
                Number.isFinite(latestAge)
                  ? Math.round(latestAge * 10) / 10 : null,
              audited_age_seconds:
                Number.isFinite(auditedAge)
                  ? Math.round(auditedAge * 10) / 10 : null,
              checks: {
                schemas_ok: schemasOK,
                historical_hash_matches:
                  historicalHashMatches,
                historical_timestamp_matches:
                  historicalDateMatches,
                certificate_pass: certificatePass,
                historical_coverage_ok:
                  historicalCoverage,
                latest_hash_matches_audited:
                  currentMatches,
                latest_current: latestCurrent,
                audited_current: auditedCurrent
              },
              hashes: {
                latest_sha256: latestHash,
                audited_sha256: auditedHash,
                certificate_snapshot_sha256:
                  cert.snapshot_sha256
              },
              note:
                'La certificacion historica solo cubre ' +
                'audited-latest.json. CERTIFIED_CURRENT ' +
                'requiere coincidencia exacta y frescura.'
            };

            fs.writeFileSync(
              'verification-result.json',
              JSON.stringify(result, null, 2) + '\n'
            );

            core.info(JSON.stringify(result, null, 2));

            if (status === 'INVALID_CERTIFICATE') {
              core.setFailed('Certificado historico invalido');
            } else {
              core.info('Verificacion completada: ' + status);
            }

      - name: Guardar verificacion
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: binance-gpt-verification
          path: verification-result.json
          if-no-files-found: warn
          retention-days: 7
